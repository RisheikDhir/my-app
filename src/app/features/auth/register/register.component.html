<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="auth-logo">⚡ DocForge</a>

    <h1>Create your account</h1>
    <p class="auth-sub">Save documents, track downloads, manage payments</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <div class="form-group">
      <label for="reg-name">Full Name</label>
      <input id="reg-name" type="text" placeholder="Raj Sharma"
        [value]="name()" (input)="setName($any($event.target).value)" autocomplete="name" />
    </div>

    <div class="form-group">
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" placeholder="you@email.com"
        [value]="email()" (input)="setEmail($any($event.target).value)" autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="reg-pass">Password</label>
      <input id="reg-pass" type="password" placeholder="Min. 6 characters"
        [value]="password()" (input)="setPassword($any($event.target).value)" autocomplete="new-password" />
    </div>

    <button class="btn-auth" (click)="submit()" [disabled]="loading()">
      @if (loading()) { Creating account… } @else { Create Account → }
    </button>

    <p class="auth-alt">Already have an account? <a routerLink="/auth/login">Sign in</a></p>

    <div class="auth-divider">or</div>

    <a routerLink="/generator" class="btn-guest">Continue as Guest (no signup needed)</a>

    <p class="auth-note">
      By creating an account you agree to our
      <a routerLink="/terms-and-conditions">Terms</a> and
      <a routerLink="/privacy-policy">Privacy Policy</a>.
    </p>
  </div>
</div>
